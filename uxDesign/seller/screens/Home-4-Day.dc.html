<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Home · Cooking day</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><style>body{margin:0}</style></helmet>
<div style="width: 1180px; height: 820px">
  <dc-import name="Home" state="cooking day" theme="{{theme}}" brand="{{brand}}" hint-size="1180px,820px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark","section":"Theme"},"brand":{"editor":"enum","options":["onde","bali","sumatra","sunda","jawa"],"default":"onde","section":"Theme"},"$preview":{"width":1180,"height":820}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.theme ?? 'dark', brand: this.props.brand ?? 'onde' };
  }
}
</script>
</body>
</html>
