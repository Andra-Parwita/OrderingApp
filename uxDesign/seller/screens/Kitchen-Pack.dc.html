<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark","section":"Theme"},"brand":{"editor":"enum","options":["onde","bali","sumatra","sunda","jawa"],"default":"onde","section":"Theme"},"$preview":{"width":1180,"height":820}}'>
class Component extends DCLogic {
  renderVals() {
    const theme = this.props.theme ?? 'dark';
    const brand = this.props.brand ?? 'onde';
    const N = {
      dark: { text:'#F1EEE6', muted:'#A9AFA3', ctrl:'#6B7266', conf:'#7EC4B0', warn:'#E9B949', warnTint:'rgba(233,185,73,.10)' },
      light:{ text:'#1C1F1A', muted:'#5D6358', ctrl:'#7F857A', conf:'#1F6B5C', warn:'#8A5A00', warnTint:'#FBF1D9' }
    };
    const B = {
      onde: { dark:{ fill:'#8CC08A', on:'#0F1E10', atext:'#93C590', tint:'rgba(140,192,138,.14)', bg:'#121411', panel:'#0E100D', surf:'#181A16', surf2:'#20231E', line:'#2A2E27', kbg:'#1D2A1A' }, light:{ fill:'#2F6B36', on:'#FFFFFF', atext:'#2A5F30', tint:'#E5EFE2', bg:'#F6F2E8', panel:'#EFEADD', surf:'#FFFDF8', surf2:'#F4F0E6', line:'#E4DED0', kbg:'#E9E3CF' } },
      bali: { dark:{ fill:'#84C3D6', on:'#0B2129', atext:'#8CC6D8', tint:'rgba(132,195,214,.14)', bg:'#101417', panel:'#0C1013', surf:'#161B1F', surf2:'#1E2429', line:'#283037', kbg:'#17262E' }, light:{ fill:'#1D5C73', on:'#FFFFFF', atext:'#1A5469', tint:'#E0EDF1', bg:'#F1F4F4', panel:'#E7EDEE', surf:'#FCFEFE', surf2:'#EEF3F4', line:'#DAE2E4', kbg:'#DCE8EB' } },
      sumatra: { dark:{ fill:'#EBA0AA', on:'#2B0A10', atext:'#EDA6AF', tint:'rgba(235,160,170,.14)', bg:'#161112', panel:'#110D0E', surf:'#1C1617', surf2:'#251D1F', line:'#322729', kbg:'#2A171B' }, light:{ fill:'#8A2232', on:'#FFFFFF', atext:'#7E1F2E', tint:'#F5E1E3', bg:'#F7F0EE', panel:'#F0E6E3', surf:'#FFFBFA', surf2:'#F6EEEC', line:'#E6D9D6', kbg:'#EED9D6' } },
      sunda: { dark:{ fill:'#A9B6EC', on:'#121A3A', atext:'#AEBBEE', tint:'rgba(169,182,236,.15)', bg:'#111219', panel:'#0D0E14', surf:'#17181F', surf2:'#1F2029', line:'#2A2C37', kbg:'#1A1D33' }, light:{ fill:'#3A4C96', on:'#FFFFFF', atext:'#34448A', tint:'#E4E7F4', bg:'#F2F2F7', panel:'#E9EAF2', surf:'#FDFDFF', surf2:'#F0F1F7', line:'#DDDFEA', kbg:'#DFE2F1' } },
      jawa: { dark:{ fill:'#D9AE7E', on:'#2A1A08', atext:'#DDB38A', tint:'rgba(217,174,126,.15)', bg:'#15120E', panel:'#100E0B', surf:'#1B1813', surf2:'#24201A', line:'#312B23', kbg:'#2A2015' }, light:{ fill:'#7A4A1E', on:'#FFFFFF', atext:'#6E431B', tint:'#F2E7DA', bg:'#F6F0E6', panel:'#EEE5D7', surf:'#FFFBF4', surf2:'#F5EEE2', line:'#E5DACA', kbg:'#EBDCC4' } }
    };
    const t = Object.assign({}, N[theme], B[brand][theme]);
    const vars = Object.keys(t).map(k => '--' + k + ':' + t[k]).join(';');
    const bag = 'M5 8h14l-1 12H6zM9 8V6a3 3 0 0 1 6 0v2';
    const truck = 'M2 6h12v10H2zM14 10h4l3 3v3h-7zM5 18.5a1.5 1.5 0 1 0 3 0a1.5 1.5 0 1 0-3 0M15 18.5a1.5 1.5 0 1 0 3 0a1.5 1.5 0 1 0-3 0';
    const orders = [
      ['B3R9TP','Siti','Clayton · 10:00','p',[[1,'Nasi Ayam Bali','1 box'],[1,'Sayur urab','Tub']],''],
      ['R4G8YA','Rachel','Clayton · 10:00','p',[[2,'Rendang','Regular'],[2,'Onde onde','Pack of 6']],''],
      ['K7M2QX','Wulan','Glenelg · 11:00','p',[[2,'Rendang','Regular'],[1,'Nasi Ayam Bali','1 box'],[1,'Onde onde','Pack of 6']],'Less spicy for the rendang, please.'],
      ['Q2N6VS','Dewi','Glenelg · 11:00','p',[[2,'Onde onde','Pack of 6']],''],
      ['E3X5NR','Ketut','Glenelg · 11:00','p',[[4,'Nasi Ayam Bali','1 box']],''],
      ['W1L7HB','Tom','Clayton · 10:00','p',[[2,'Sayur urab','Tub']],''],
      ['H8D4LM','Michael','Delivery · from 12:00','d',[[3,'Rendang','Regular'],[2,'Sambal matah','Small jar']],''],
      ['T5J1WC','Anastasia','Delivery · from 12:00','d',[[2,'Nasi Ayam Bali','1 box'],[2,'Sayur urab','Tub'],[1,'Sambal matah','Small jar']],''],
      ['C6P2ZU','Putri','Delivery · from 12:00','d',[[1,'Nasi Ayam Bali','1 box'],[1,'Onde onde','Pack of 6']],''],
      ['Y8S2DF','Linh','Delivery · from 12:00','d',[[1,'Rendang','Regular'],[1,'Sambal matah','Small jar']],'']
    ];
    const defTicks = { B3R9TP:[0,1], R4G8YA:[0,1], K7M2QX:[0], W1L7HB:[0] };
    const ticks = this.state.ticks ?? defTicks;
    const packed = this.state.packed ?? ['B3R9TP','R4G8YA','W1L7HB'];
    const curCode = this.state.cur ?? 'K7M2QX';
    const bags = orders.map(o => {
      const tk = ticks[o[0]] ?? [];
      const isPacked = packed.includes(o[0]);
      const isCur = o[0] === curCode;
      return { code:o[0], name:o[1], where:o[2], prog: isPacked ? 'Packed' : tk.length + '/' + o[4].length,
        progColor: isPacked ? t.conf : (tk.length ? t.text : t.muted),

        dotStyle: isPacked ? 'background: ' + t.fill + '; color: ' + t.on : 'border: 1.5px solid ' + t.ctrl,

    const co = orders.find(o => o[0] === curCode);
    const ctk = ticks[co[0]] ?? [];
    const items = co[4].map((it, i) => {
      const on = ctk.includes(i);
      return { qty:it[0], name:it[1], size:it[2], on: on ? 'true' : 'false', tick: on ? '1' : '0',
        box: on ? 'background: var(--fill); color: var(--on)' : 'border: 2px solid var(--ctrl); color: transparent',

    const cur = { code:co[0], name:co[1], where: co[2] + (co[3] === 'p' ? ' pickup' : ''), fulD: co[3] === 'p' ? bag : truck,

    const idx = orders.findIndex(o => o[0] === curCode);
    const nextOpen = orders.slice(idx + 1).concat(orders.slice(0, idx)).find(o => !packed.includes(o[0]) && o[0] !== curCode);
    return { vars, bags, cur, packedCount: packed.length,

  }
}
</script>
