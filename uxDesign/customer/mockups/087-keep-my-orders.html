<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Remember me (mock-up)</title>
<style>
/* Tokens: the customer app's "ondeonde" theme, light and dark (same as 082-store.html) */
:root{
  --beige:#EADBC2; --ink:#2B1D12; --bobo:#d9772b; --stage:#d9d4c6; --pill-bg:#fff6ea; --pill-border:#ead8bf;
  --text:#1C1F1A; --muted:#5D6358; --edge:#7F857A; --ok:#1F6B5C; --warn:#8A5A00; --danger:#A93724; --onfill:#FFFFFF;
  --warnbg:#FBF1D9;
  --fill:#2F6B36; --acc:#2A5F30; --tint:#E5EFE2; --bg:#F6F2E8; --panel:#EFEADD; --surface:#FFFDF8; --s2:#F4F0E6; --line:#E4DED0;
  --ph:88%; --pl:42%; --ps:38%;
}
:root[data-theme=dark]{
  --text:#F1EEE6; --muted:#A9AFA3; --edge:#6B7266; --ok:#7EC4B0; --warn:#E9B949; --danger:#EE8B78; --onfill:#0F1E10;
  --warnbg:rgba(233,185,73,.10); --bobo:#E8954F;
  --fill:#8CC08A; --acc:#93C590; --tint:color-mix(in srgb,#8CC08A 15%,#121411); --bg:#121411; --panel:#0E100D; --surface:#181A16; --s2:#20231E; --line:#2A2E27;
  --pill-bg:#2A2117; --pill-border:#3D3022; --ph:22%; --pl:62%; --ps:26%;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--stage);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
:root[data-theme=dark] body{background:#0B0C0A}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px;border-radius:6px}
button,a,input{font:inherit;color:inherit}
button{cursor:pointer}

/* mock-up chrome */
.top{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;align-items:center;padding:14px 16px}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--ink);border-radius:999px;overflow:hidden;background:var(--pill-bg)}
.seg button{border:0;background:transparent;padding:6px 14px;font-size:.8125rem;font-weight:600;min-height:36px;color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--beige)}
:root[data-theme=dark] .seg{border-color:#6B5A44}
:root[data-theme=dark] .seg button{color:#EADBC2}
:root[data-theme=dark] .seg button[aria-pressed=true]{background:#EADBC2;color:#2B1D12}
.sub{display:flex;justify-content:center;padding:0 16px 12px;min-height:36px}
.frame-wrap{display:flex;justify-content:center;padding:0 16px 24px;overflow-x:auto}
.frame{position:relative;background:var(--bg);border-radius:18px;box-shadow:0 2px 6px rgb(40 30 15/12%),0 12px 36px rgb(40 30 15/14%);overflow:hidden;display:flex;flex-direction:column;height:780px;max-height:calc(100vh - 150px);min-height:600px;flex:none}
.frame.phone{width:390px}
.frame.tablet{width:1024px}

/* app look */
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.scroll{flex:1;min-height:0;overflow-y:auto;position:relative}
.wrap{max-width:760px;margin:0 auto}
.bar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;min-height:44px;padding:8px 12px;flex:none;background:var(--bg)}
.bk{justify-self:start;display:inline-flex;align-items:center;gap:4px;min-height:44px;min-width:44px;padding:0 8px 0 0;border:0;background:none;color:var(--acc);font-weight:700}
.logo{grid-column:2;display:inline-flex;align-items:center;gap:6px;max-height:2rem;font-weight:800;letter-spacing:-.03em;font-size:1.0625rem;color:var(--text);white-space:nowrap}
.logo svg{width:24px;height:24px}
.logo i{font-style:normal;color:var(--bobo)}
.title{margin:0;padding:4px 16px 12px;font-size:1.75rem;line-height:1.2;font-weight:700}
.intro{padding:4px 16px}
.intro p{margin:0;color:var(--muted);font-size:.9375rem}
.ful{display:flex;gap:6px;align-items:flex-start;margin-top:6px;font-size:.8125rem;color:var(--muted)}
.ful svg{width:16px;height:16px;margin-top:2px}
.ful b{color:var(--text);font-weight:700}
h2.sec{margin:18px 16px 8px;font-size:1.0625rem;font-weight:700}
.small{font-size:.8125rem}.muted{color:var(--muted)}
.pic{width:64px;height:64px;border-radius:10px;border:1px solid var(--line);flex:none;background:hsl(var(--h) 38% var(--ph));display:grid;place-items:center}
.pic i{display:block;width:30px;height:30px;border-radius:9px;background:hsl(var(--h) var(--ps) var(--pl))}
.pr{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line)}
.lst{border-top:1px solid var(--line)}
.inf{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.nm{font-weight:700;font-size:1rem;line-height:1.25}
.sz{color:var(--muted);font-size:.875rem}
.pc{font-size:.875rem;font-variant-numeric:tabular-nums}
.round{width:44px;height:44px;border-radius:50%;border:0;background:var(--line);color:var(--text);display:inline-flex;align-items:center;justify-content:center;padding:0;flex:none}
.round svg{width:18px;height:18px}
.main{display:flex;width:100%;align-items:center;justify-content:center;gap:8px;min-height:3.25rem;padding:0 16px;border:0;border-radius:999px;background:var(--fill);color:var(--onfill);font-weight:700;font-size:1rem}
.ghost{display:flex;width:100%;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border:1px solid var(--edge);border-radius:999px;background:transparent;color:var(--text);font-weight:700;font-size:.9375rem}
.lnk{border:0;background:none;color:var(--acc);font-weight:700;min-height:44px;padding:0 8px;text-decoration:underline;text-underline-offset:3px}
.danger{color:var(--danger)}
.tabbar{display:flex;flex:none;background:var(--bg);border-top:1px solid var(--line)}
.tabin{display:flex;width:100%;max-width:760px;margin:0 auto}
.tabin>div{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:56px;font-size:.8125rem;color:var(--muted)}
.tabin>div.on{color:var(--acc);font-weight:700}
.tabin>div.on::before{content:"";position:absolute;top:0;width:2rem;height:3px;border-radius:0 0 3px 3px;background:var(--acc)}
.tabbar svg{width:22px;height:22px}
.scrim{position:absolute;inset:0;z-index:30;background:rgb(20 18 12/52%);display:flex;align-items:flex-end;justify-content:center}
.tablet .scrim{align-items:center}
.sheet{background:var(--surface);width:100%;max-height:94%;overflow-y:auto;border-radius:18px 18px 0 0;position:relative;padding:20px 18px 18px}
.tablet .sheet{width:520px;border-radius:16px}
.sheet h3{margin:0 0 6px;font-size:1.1875rem;line-height:1.25;padding-right:36px}
.sheet p{margin:6px 0;font-size:.9375rem}
.sheet .x{position:absolute;right:6px;top:6px;width:44px;height:44px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center}
.sheet h4{margin:14px 0 4px;font-size:.9375rem}
.ul{margin:0;padding:0;list-style:none}
.ul li{display:flex;gap:8px;align-items:flex-start;margin:5px 0;font-size:.9375rem}
.ul svg{width:18px;height:18px;margin-top:2px;color:var(--ok)}
.btns{display:grid;gap:8px;margin-top:16px}

/* the quiet chip (menu home) */
.qchip{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;background:var(--surface);margin:10px 16px 0;min-height:36px}
.qchip button{border:0;background:transparent;min-height:36px;font-size:.8125rem;font-weight:600;color:var(--text)}
.qchip .go{padding:0 6px 0 12px;display:inline-flex;align-items:center;gap:6px;border-radius:999px 0 0 999px}
.qchip .go svg{width:15px;height:15px;color:var(--acc)}
.qchip .dx{width:36px;color:var(--muted);display:grid;place-items:center;border-radius:0 999px 999px 0}
.qchip .dx svg{width:14px;height:14px}

/* cards and rows */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin:12px 16px;padding:14px}
.card h3{margin:0 0 4px;font-size:1rem}
.card p{margin:4px 0;font-size:.875rem;color:var(--muted)}
.card .hd{display:flex;gap:10px;align-items:flex-start}
.card .hd>svg{color:var(--acc);width:22px;height:22px;margin-top:1px}
.ico{width:36px;height:36px;border-radius:10px;background:var(--tint);color:var(--acc);display:grid;place-items:center;flex:none}
.kv{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--line);font-size:.9375rem;min-height:44px}
.kv:first-of-type{border-top:0}
.kv span:last-child{color:var(--muted);font-size:.875rem;text-align:right}
.rowbtn{display:flex;width:100%;align-items:center;justify-content:space-between;min-height:48px;padding:0;border:0;border-top:1px solid var(--line);background:transparent;font-size:.9375rem;font-weight:600;text-align:left}
.rowbtn svg{color:var(--muted)}
.on-pill{display:inline-flex;align-items:center;gap:4px;font-size:.75rem;font-weight:700;color:var(--ok);background:var(--tint);border-radius:999px;padding:2px 10px}
.stat{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:36px 24px 8px}
.stat svg{width:44px;height:44px;stroke-width:1.5;color:var(--muted)}
.stat b{font-size:1.0625rem}
.stat span{color:var(--muted);font-size:.9375rem}
.field{display:flex;gap:8px;margin:10px 16px}
.field .in{flex:1;min-height:48px;border:1px solid var(--edge);border-radius:12px;background:var(--surface);padding:10px 12px;color:var(--muted)}
.hint{display:flex;gap:10px;align-items:flex-start;margin:14px 16px 0;padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font-size:.8125rem;color:var(--muted)}
.hint .grow{flex:1}
.hint b{color:var(--text)}
.hint .dx{border:0;background:transparent;width:36px;height:36px;display:grid;place-items:center;color:var(--muted);flex:none;margin:-6px -8px -6px 0}
.hint .dx svg{width:16px;height:16px}
.code{display:flex;gap:8px;justify-content:center;margin:14px 0}
.code span{width:42px;height:54px;border:1px solid var(--edge);border-radius:10px;background:var(--surface);display:grid;place-items:center;font-size:1.5rem;font-weight:700;font-variant-numeric:tabular-nums}
.code span.cur{border:2px solid var(--acc)}
.timer{text-align:center;color:var(--muted);font-size:.8125rem}
.tag{display:inline-block;font-size:.6875rem;font-weight:700;border-radius:999px;padding:1px 8px;background:var(--warnbg);color:var(--warn);border:1px solid var(--pill-border)}
.toast{position:absolute;left:16px;right:16px;bottom:72px;z-index:20;background:var(--ink);color:var(--beige);border-radius:12px;padding:10px 14px;font-size:.875rem;display:flex;gap:8px;align-items:center}
:root[data-theme=dark] .toast{background:#EADBC2;color:#2B1D12}

/* OS passkey sheet (generic, not a real Apple/Google UI) */
.os{background:#F2F2F4;color:#111;width:100%;border-radius:22px 22px 0 0;padding:20px 22px 24px;text-align:center}
.tablet .os{width:420px;border-radius:22px}
.os .fi{width:56px;height:56px;margin:4px auto 8px;border:2px solid #1b4fd8;border-radius:16px;display:grid;place-items:center;color:#1b4fd8}
.os .fi svg{width:30px;height:30px}
.os h3{margin:6px 0 4px;font-size:1.0625rem}
.os p{margin:4px 0;font-size:.875rem;color:#444}
.os .acct{margin:12px 0;border-radius:12px;background:#fff;padding:10px 12px;text-align:left;font-size:.875rem;border:1px solid #d6d6da}
.os .acct b{display:block}
.os button{width:100%;min-height:46px;border-radius:12px;border:0;font-weight:600;margin-top:8px;background:#e1e1e6;color:#111}
.os button.p{background:#1b4fd8;color:#fff}
:root[data-theme=dark] .os{background:#2A2A2E;color:#f2f2f2}
:root[data-theme=dark] .os p{color:#c8c8cc}
:root[data-theme=dark] .os .acct{background:#1c1c1f;border-color:#3d3d42}
:root[data-theme=dark] .os button{background:#3a3a40;color:#f2f2f2}
:root[data-theme=dark] .os button.p{background:#6c93ff;color:#0b1330}
:root[data-theme=dark] .os .fi{border-color:#6c93ff;color:#6c93ff}

/* order placed */
.ok-hd{text-align:center;padding:20px 16px 8px}
.ok-hd .big{width:48px;height:48px;border-radius:50%;background:var(--tint);color:var(--acc);display:grid;place-items:center;margin:0 auto 8px}
.ok-hd .big svg{width:26px;height:26px}
.ok-hd h1{margin:0;font-size:1.5rem}
.onum{display:inline-block;margin-top:6px;font-size:1.125rem;font-weight:700;letter-spacing:.04em;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px 12px}
.tr{display:flex;justify-content:space-between;padding:3px 16px;font-variant-numeric:tabular-nums;font-size:.9375rem}
.tr.b{font-weight:700}

/* seller tablet */
.sell{display:grid;grid-template-columns:340px 1fr;flex:1;min-height:0}
.sell .list{border-right:1px solid var(--line);overflow-y:auto}
.sell .hdr{padding:14px 16px;border-bottom:1px solid var(--line);font-weight:700;display:flex;justify-content:space-between;align-items:center}
.orow{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.orow.sel{background:var(--tint)}
.orow .l1{display:flex;justify-content:space-between;gap:8px;font-weight:700}
.orow .l2{font-size:.8125rem;color:var(--muted)}
.pk{display:inline-flex;align-items:center;gap:4px;font-size:.75rem;font-weight:700;color:var(--ok)}
.pk svg{width:13px;height:13px;stroke-width:2.5}
.pk.big{font-size:.8125rem;background:var(--tint);border-radius:999px;padding:2px 10px}
.det{overflow-y:auto;padding:18px 24px}
.det h2{margin:0;font-size:1.375rem;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.det .meta{margin:6px 0 14px;color:var(--muted);font-size:.9375rem;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.det table{width:100%;border-collapse:collapse;font-size:.9375rem}
.det td{padding:8px 0;border-bottom:1px solid var(--line)}
.det td:last-child{text-align:right;font-variant-numeric:tabular-nums}
.stp{display:flex;gap:8px;margin:16px 0;flex-wrap:wrap}
.stp span{border:1px solid var(--edge);border-radius:999px;padding:6px 14px;font-size:.875rem;font-weight:600}
.stp span.on{background:var(--fill);border-color:var(--fill);color:var(--onfill)}

/* notes */
.notes{max-width:1024px;margin:0 auto 40px;padding:0 16px}
.notes>div{background:var(--surface);border:1px solid #cfc8b4;border-left:3px solid var(--bobo);border-radius:0 10px 10px 0;padding:14px 18px;font-size:.875rem}
:root[data-theme=dark] .notes>div{border-color:#3A3F36;border-left-color:var(--bobo)}
.notes h3{margin:0 0 6px;font-size:.9375rem}
.notes ul{margin:0;padding-left:20px}
.notes li{margin:3px 0}
@media print{.top,.sub,.notes{display:none}}
</style>
</head>

<div class="frame-wrap"><div class="frame phone" id="frame"></div></div>

const S={scr:0,sub:[0,0,0,0,0,0,0],dev:'phone',th:'light',lang:'en'};
const t=()=>T[S.lang];
const aud=n=>'$'+n.toFixed(2).replace('.',S.lang==='id'?',':'.');

const LOGO=()=>`<span class="logo"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="3" width="12" height="3.5" rx="1" fill="currentColor" opacity=".55"/><rect x="4.5" y="6.5" width="15" height="14" rx="4" fill="var(--bobo)"/><rect x="8" y="11" width="8" height="5" rx="1.5" fill="var(--bg)"/></svg>Onde <i>Onde</i></span>`;
const topbar=()=>`<header class="bar">${LOGO()}</header>`;
function tabbar(on){
 const ics=['menu','bag','gear'];
 return `<nav class="tabbar" aria-label="Main"><div class="tabin">${t().tabs.map((x,i)=>`<div class="${i==on?'on':''}">${ic(ics[i])}${x}</div>`).join('')}</div></nav>`;
}
const pic=(h)=>`<span class="pic" style="--h:${h}"><i></i></span>`;
const dishes=()=>`<div class="lst">${t().dishes.map((d,i)=>`<div class="pr">${pic([30,12,330][i])}<div class="inf"><span class="nm">${d[0]}</span><span class="pc">${d[1]} · <b>${aud(d[2])}</b></span></div><button class="round" aria-label="+" tabindex="-1">${ic('plus')}</button></div>`).join('')}</div>`;

/* 1 menu home */
function menuHome(){
 const T_=t();
 return topbar()+`<div class="scroll"><div class="wrap">
  <div class="intro"><p>${T_.tag}</p>
   <div class="ful">${ic('menu')}<span><b>${T_.pick}</b> · ${T_.pickV}</span></div>
   <div class="ful">${ic('bag')}<span><b>${T_.del}</b> · ${T_.delV}</span></div></div>
  ${S.sub[0]===0?`<div class="qchip"><button class="go" data-go="1" aria-label="${T_.chipA}">${ic('lock')}${T_.chip}</button><button class="dx" data-hide aria-label="${T_.dismiss}">${ic('x')}</button></div>`:''}
  <h2 class="sec">${T_.menuH}</h2>${dishes()}<div style="height:24px"></div></div></div>`+tabbar(0);
}
/* 2 explanation sheet */
function expl(){
 const T_=t(), noprf=S.sub[1]===1;
 return `<div class="scrim"><div class="sheet" role="dialog" aria-label="${T_.shT}">
  <button class="x" data-close aria-label="${T_.close}">${ic('x')}</button>
  <h3>${T_.shT}</h3><p>${T_.shP}</p>
  <ul class="ul">${T_.adv.map(x=>`<li>${ic('check')}<span>${x}</span></li>`).join('')}</ul>
  <h4>${T_.whyH}</h4>
  <ul class="ul">${T_.why.map(x=>`<li>${ic('lock')}<span>${x}</span></li>`).join('')}</ul>
  ${noprf?`<div class="hint" style="margin:12px 0 0"><span class="grow">${T_.noPrf}</span></div>`:''}
  <p class="muted small" style="margin-top:10px">${T_.shN}</p>
  <div class="btns"><button class="main" data-go="2">${ic('face')}${T_.turnOn}</button><button class="ghost" data-close>${T_.notNow}</button></div>
 </div></div>`;
}
/* 3 settings + OS prompt */
function settingsPage(on){
 const T_=t();
 const card=on?`<div class="card"><div class="hd"><span class="ico">${ic('lock')}</span><div style="flex:1"><h3>${T_.onT} <span class="on-pill">${ic('check')}${T_.on}</span></h3></div></div>
   <div class="kv" style="margin-top:8px"><span>${T_.thisPhone}</span><span>${T_.thisPhoneV}</span></div>
   <div class="kv"><span>${T_.code}</span><span><b style="color:var(--text);letter-spacing:.04em">C-7K3M</b></span></div>
   <p class="small" style="margin:0 0 6px">${T_.codeH}</p>
   <button class="rowbtn" data-go="3">${T_.addPh}${ic('next')}</button>
   <button class="rowbtn">${T_.signOut}${ic('next')}</button>
   <button class="rowbtn danger">${T_.delAll}${ic('trash')}</button>
   <p class="small" style="margin:2px 0 0">${T_.delNote}</p></div>`
  :`<div class="card"><div class="hd"><span class="ico">${ic('lock')}</span><div style="flex:1"><h3>${T_.cardOffT}</h3><p>${T_.cardOffP}</p></div></div>
   <div class="btns" style="margin-top:10px"><button class="ghost" data-go="1">${T_.learn}</button></div></div>`;
 return topbar()+`<div class="scroll"><div class="wrap"><h1 class="title">${T_.setH}</h1>
  <div class="card" style="padding:4px 14px"><div class="kv"><span>${T_.name}</span><span>Putu</span></div><div class="kv"><span>${T_.lang}</span><span>${T_.langV}</span></div><div class="kv"><span>${T_.notif}</span><span>${T_.notifV}</span></div></div>
  ${card}<div style="height:16px"></div></div></div>`+tabbar(2);
}
function osSheet(){
 const T_=t();
 return `<div class="scrim"><div class="os" role="dialog" aria-label="${T_.osT}">
  <div class="fi">${ic('face')}</div><h3>${T_.osT}</h3><p>${T_.osP}</p>
  <div class="acct"><b>${T_.osA[0]}</b>${T_.osA[1]}</div>
  <p>${T_.osF}</p>
  <button class="p" data-go="4">${T_.osB}</button><button data-go="5">${T_.osC}</button></div></div>`;
}
/* 4 add another phone */
function addPhone(){
 const T_=t(), n=S.sub[3]===1;
 const dig=(s,cur)=>`<div class="code">${s.split('').map((c,i)=>`<span class="${i===cur?'cur':''}">${c==='_'?'':c}</span>`).join('')}</div>`;
 const body=n
  ?`<div class="card"><h3>${T_.apT2}</h3><p>${T_.apP2}</p><p style="margin-top:12px;font-weight:700;color:var(--text)">${T_.typeC}</p>${dig('48271_',5)}
     <div class="btns"><button class="main" disabled style="opacity:.55">${T_.conf}</button><button class="lnk">${T_.other}</button></div></div>`
  :`<div class="card"><h3>${T_.apT}</h3><p>${T_.apP}</p>${dig('482 719'.replace(' ',''),-1)}<div class="timer">${T_.exp}</div>
     <div class="btns"><button class="ghost">${T_.newC}</button></div></div>`;
 return topbar().replace('<header class="bar">','<header class="bar"><button class="bk" data-go="4">'+ic('back')+'<span>'+T_.setH+'</span></button>')+`<div class="scroll"><div class="wrap"><h1 class="title">${n?T_.apT2:T_.apT}</h1>${body}</div></div>`+tabbar(n?1:2);
}
/* 5 empty My orders */
function myOrders(){
 const T_=t(), st=S.sub[4];
 const o=(a,sel)=>`<div class="pr"><div class="inf"><span class="nm">${a[0]} <span class="muted" style="font-weight:400">${a[1]}</span></span><span class="pc">${a[2]} · <b>${a[3]}</b></span></div>${ic('next')}</div>`;
 const body=st===2
  ?`<div class="lst">${o(T_.o2)}${o(T_.o1)}${o(T_.o3)}</div><div class="toast">${ic('check')}<span>${T_.restored}</span></div>`
  :`<div class="stat">${ic('bag')}<b>${T_.empT}</b><span>${T_.empP}</span></div>
    <div class="card" style="margin-top:20px"><h3>${T_.restoreT}</h3><p>${T_.restoreP}</p><div class="btns" style="margin-top:10px"><button class="main" data-go="1b">${ic('lock')}${T_.restore}</button></div></div>
    <div class="card"><h3>${T_.haveC}</h3><p>${T_.haveCP}</p><div class="field" style="margin:8px 0 0"><div class="in">A-1042</div><button class="ghost" style="width:auto">${T_.find}</button></div></div>`;
 return topbar()+`<div class="scroll"><div class="wrap"><h1 class="title">${T_.mo}</h1>${body}</div></div>`+tabbar(1)+(st===1?osSheet().replace('data-go="4"','data-go="5b"').replace('data-go="5"','data-go="5a"'):'');
}
/* 6 order placed */
function placed(){
 const T_=t();
 return topbar()+`<div class="scroll"><div class="wrap">
  <div class="ok-hd"><div class="big">${ic('check')}</div><h1>${T_.okT}</h1><span class="onum">#A-1051</span><p class="muted" style="margin:8px 0 0;font-size:.9375rem">${T_.okP}</p></div>
  <div style="padding:12px 16px"><button class="main">${T_.wa}</button></div>
  <p class="small muted" style="margin:0 16px">${T_.okS}</p>
  <div style="border-top:1px solid var(--line);margin:16px 0 6px">${T_.dishes.slice(0,2).map(d=>`<div class="tr" style="padding-top:8px"><span>${d[0]} × 1</span><span>${aud(d[2])}</span></div>`).join('')}</div>
  <div class="tr b"><span>${T_.tot}</span><span>${aud(32.5)}</span></div>
  <p class="small muted" style="margin:6px 16px">${T_.pay}</p>
  ${S.sub[5]===0?`<div class="hint">${ic('lock')}<span class="grow">${T_.nudge}<button class="lnk" style="min-height:32px;padding:0;font-size:.8125rem" data-go="1">${T_.nudgeL}</button></span><button class="dx" data-hide aria-label="${T_.dismiss}">${ic('x')}</button></div>`:''}
  <div style="height:24px"></div></div></div>`+tabbar(1);
}
/* 7 seller (tablet) */
function seller(){
 const T_=t(), np=S.sub[6]===1;
 const pk=(sm)=>`<span class="pk${sm?'':' big'}">${ic('check')}${T_.pkc} · C-7K3M</span>`;
 const row=(nm,id,meta,sel,mark)=>`<div class="orow ${sel?'sel':''}"><div class="l1"><span>${nm}</span><span>${id}</span></div><div class="l2">${meta}</div>${mark||''}</div>`;
 const list=`<div class="list"><div class="hdr"><span>${T_.sellT}</span><span class="tag">${T_.prep} 4</span></div>
  ${row('Putu','#A-1051',T_.pickup+' · $32.50',!np,`<span class="pk">${ic('check')}${T_.pkc} · C-7K3M</span>`)}
  ${row('Wayan','#A-1050',T_.pickup+' · $18.00',false,`<span class="pk">${ic('check')}${T_.pkc} · C-2QX9</span>`)}
  ${row('Made','#A-1049',T_.del+' · $41.00',np,'')}
  ${row('Kadek','#A-1048',T_.pickup+' · $14.50',false,'')}</div>`;
 const dt=`<div class="det"><h2>${np?'Made':'Putu '+pk(false)}</h2>
  <div class="meta"><span>${np?'#A-1049':'#A-1051'}</span><span>·</span><span>${T_.pickup} Sat 24 Oct</span><span>·</span><span>${T_.wapp}</span></div>
  <div class="stp">${T_.steps.map((s,i)=>`<span class="${i===1?'on':''}">${s}</span>`).join('')}</div>
  <table><tbody>${[[T_.dishes[0][0]+' × 1',14.5],[T_.dishes[1][0]+' × 1',18]].map(r=>`<tr><td>${r[0]}</td><td>${aud(r[1])}</td></tr>`).join('')}<tr><td><b>${T_.total}</b></td><td><b>${aud(32.5)}</b></td></tr></tbody></table>
  ${np?'':`<p class="small muted" style="margin-top:12px">${T_.sellNote}</p>`}</div>`;
 return `<header class="bar"><span class="logo" style="grid-column:2">Onde <i>Onde</i> · ${S.lang==='en'?'Seller':'Penjual'}</span></header><div class="sell">${list}${dt}</div>`;
}

function render(){
 const fr=$('#frame'), s=S.scr, u=S.sub[s];
 fr.className='frame '+(s===6?'tablet':S.dev);
 let h;
 if(s===1)S.sub[0]=0;
 if(s===0)h=menuHome();
 else if(s===1)h=menuHome()+expl();
 else if(s===2)h=u===0?settingsPage(false)+osSheet():settingsPage(u===1);
 else if(s===3)h=addPhone();
 else if(s===4)h=myOrders();
 else if(s===5)h=placed();
 else h=seller();
 fr.innerHTML=h;
 $('#scrseg').innerHTML=t().scr.map((x,i)=>`<button type="button" data-scr="${i}" aria-pressed="${i===s}">${x}</button>`).join('');
 $('#subseg').innerHTML=t().subs[s].map((x,i)=>`<button type="button" data-sub="${i}" aria-pressed="${i===u}">${x}</button>`).join('');
 const dv=s===6?'tablet':S.dev;
 document.querySelectorAll('[data-dev]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.dev===dv));
 document.querySelectorAll('[data-th]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.th===S.th));
 document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===S.lang));
 document.documentElement.dataset.theme=S.th; document.documentElement.lang=S.lang;
 const N=t();
 $('#notes').innerHTML=`<div><h3>${N.nH}</h3><ul>${N.n.map(x=>`<li>${x}</li>`).join('')}</ul></div>`;
}
const go=(scr,sub)=>{S.scr=scr;S.sub[scr]=sub||0;render()};
document.addEventListener('click',e=>{
 const g=sel=>e.target.closest(sel); let b;
 if(b=g('[data-scr]')){S.scr=+b.dataset.scr;render();return}
 if(b=g('[data-sub]')){S.sub[S.scr]=+b.dataset.sub;render();return}
 if(b=g('[data-dev]')){S.dev=b.dataset.dev;render();return}
 if(b=g('[data-th]')){S.th=b.dataset.th;render();return}
 if(b=g('[data-lang]')){S.lang=b.dataset.lang;render();return}
 if(g('[data-hide]')){S.sub[S.scr]=1;render();return}
 if(g('[data-close]')){go(0);return}
 if(b=g('[data-go]')){
  const v=b.dataset.go;
  if(v==='1'){go(1)} else if(v==='2'){go(2,0)} else if(v==='3'){go(3,0)}
  else if(v==='4'){go(2,1)} else if(v==='5'){go(2,2)}
  else if(v==='1b'){go(4,1)} else if(v==='5b'){go(4,2)} else if(v==='5a'){go(4,0)}
 }
});
render();
</script>
