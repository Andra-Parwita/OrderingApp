<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" font-family="Arial, Helvetica, sans-serif">
  <rect width="1200" height="200" fill="#d9e4ec"/>
  <rect width="1200" height="55" fill="#e8c9c9"/>
  <line x1="0" y1="55" x2="1200" y2="55" stroke="#a03030" stroke-width="2" stroke-dasharray="10 8"/>
  <text x="24" y="36" font-size="22" fill="#7a2020">0–55 px: may be hidden on smaller iPhones</text>
  <text x="24" y="172" font-size="20" font-weight="bold" fill="#233443">TOP 200 px · iPhone app only, behind the clock</text>
  <text x="24" y="193" font-size="15" fill="#233443">sharp, not blurred · sky, wall, wood, leaves, pattern · no text, logo, faces or food</text>
  <rect x="80" y="90" width="220" height="60" fill="none" stroke="#233443" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="190" y="127" font-size="18" fill="#233443" text-anchor="middle">time (white)</text>
  <rect x="460" y="70" width="280" height="80" rx="40" fill="none" stroke="#233443" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="600" y="117" font-size="18" fill="#233443" text-anchor="middle">camera (black)</text>
  <rect x="900" y="90" width="220" height="60" fill="none" stroke="#233443" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="1010" y="127" font-size="18" fill="#233443" text-anchor="middle">signal, battery (white)</text>
  <rect y="200" width="1200" height="400" fill="#efe4cf"/>
  <line x1="0" y1="200" x2="1200" y2="200" stroke="#1d1d1d" stroke-width="4"/>
  <text x="1176" y="228" font-size="20" font-weight="bold" fill="#1d1d1d" text-anchor="end">↑ seam at 200 px</text>
  <text x="24" y="390" font-size="34" font-weight="bold" fill="#3d2f17">BOTTOM 1200 × 400 · the banner everyone sees</text>
  <text x="24" y="434" font-size="24" fill="#3d2f17">name, logo, faces, food · browsers, Android, tablet, iPhone</text>
</svg>
