<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Store mode (mock-up)</title>
<style>
/* Tokens: the customer app's "ondeonde" theme (uxDesign/customer/tokens/tokens.css), light and dark */
:root{
  --beige:#EADBC2; --ink:#2B1D12; --bobo:#d9772b; --stage:#d9d4c6; --pill-bg:#fff6ea; --pill-border:#ead8bf;
  --text:#1C1F1A; --muted:#5D6358; --edge:#7F857A; --ok:#1F6B5C; --warn:#8A5A00; --danger:#A93724; --onfill:#FFFFFF;
  --warnbg:#FBF1D9;
  --fill:#2F6B36; --acc:#2A5F30; --tint:#E5EFE2; --bg:#F6F2E8; --panel:#EFEADD; --surface:#FFFDF8; --s2:#F4F0E6; --line:#E4DED0;
  --ph:88%; --pl:42%; --ps:38%;
}
:root[data-theme=dark]{
  --text:#F1EEE6; --muted:#A9AFA3; --edge:#6B7266; --ok:#7EC4B0; --warn:#E9B949; --danger:#EE8B78; --onfill:#0F1E10;
  --warnbg:rgba(233,185,73,.10); --bobo:#E8954F;
  --fill:#8CC08A; --acc:#93C590; --tint:color-mix(in srgb,#8CC08A 15%,#121411); --bg:#121411; --panel:#0E100D; --surface:#181A16; --s2:#20231E; --line:#2A2E27;
  --pill-bg:#2A2117; --pill-border:#3D3022; --ph:22%; --pl:62%; --ps:26%;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--stage);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
:root[data-theme=dark] body{background:#0B0C0A}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px;border-radius:6px}
button,a,input{font:inherit;color:inherit}
button{cursor:pointer}

/* mock-up chrome */
.top{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;align-items:center;padding:14px 16px}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--ink);border-radius:999px;overflow:hidden;background:var(--pill-bg)}
.seg button{border:0;background:transparent;padding:6px 14px;font-size:.8125rem;font-weight:600;min-height:36px;color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--beige)}
:root[data-theme=dark] .seg{border-color:#6B5A44}
:root[data-theme=dark] .seg button{color:#EADBC2}
:root[data-theme=dark] .seg button[aria-pressed=true]{background:#EADBC2;color:#2B1D12}
.sub{display:flex;justify-content:center;padding:0 16px 12px;min-height:36px}
.frame-wrap{display:flex;justify-content:center;padding:0 16px 24px;overflow-x:auto}
.frame{position:relative;background:var(--bg);border-radius:18px;box-shadow:0 2px 6px rgb(40 30 15/12%),0 12px 36px rgb(40 30 15/14%);overflow:hidden;display:flex;flex-direction:column;height:780px;max-height:calc(100vh - 150px);min-height:600px;flex:none}
.frame.phone{width:390px}
.frame.tablet{width:1024px}

/* app: same look as the customer app */
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.scroll{flex:1;min-height:0;overflow-y:auto;position:relative}
.wrap{max-width:760px;margin:0 auto}
/* top bar: ‹ Back on the left, the kitchen's logo centred (components/CustomerPage.tsx) */
.bar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;min-height:44px;padding:8px 12px;flex:none;background:var(--bg)}
.bk{justify-self:start;display:inline-flex;align-items:center;gap:4px;min-height:44px;min-width:44px;padding:0 8px 0 0;border:0;background:none;color:var(--acc);font-weight:700}
.logo{grid-column:2;display:inline-flex;align-items:center;gap:6px;max-height:2rem;font-weight:800;letter-spacing:-.03em;font-size:1.0625rem;color:var(--text);white-space:nowrap}
.logo svg{width:24px;height:24px}
.logo i{font-style:normal;color:var(--bobo)}
.title{margin:0;padding:4px 16px 12px;font-size:1.75rem;line-height:1.2;font-weight:700}
.banner{aspect-ratio:3/1;background:var(--s2);overflow:hidden}
.banner svg{display:block;width:100%;height:100%}
.intro{padding:12px 16px 4px}
.intro p{margin:0;color:var(--muted);font-size:.9375rem}
.ful{display:flex;gap:6px;align-items:flex-start;margin-top:8px;font-size:.8125rem;color:var(--muted)}
.ful svg{width:16px;height:16px;margin-top:2px}
.ful b{color:var(--text);font-weight:700}
.sbox{position:relative;margin:12px 16px 4px}
.sbox>svg{position:absolute;left:14px;top:14px;color:var(--muted)}
.sbox input{width:100%;height:48px;padding:0 44px 0 42px;border:1px solid var(--edge);border-radius:999px;background:var(--surface);font-size:1rem;color:var(--text)}
.sbox input::placeholder{color:var(--muted);opacity:1}
.sbox .clr{position:absolute;right:2px;top:2px;width:44px;height:44px;border:0;background:transparent;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
h2.sec{margin:20px 16px 8px;font-size:1.0625rem;font-weight:700;display:flex;align-items:baseline;justify-content:space-between}
h2.sec span{font-size:.8125rem;font-weight:400;color:var(--muted)}

/* featured row */
.feat{display:flex;gap:12px;overflow-x:auto;padding:0 16px 4px;scroll-snap-type:x proximity;scrollbar-width:none}
.feat::-webkit-scrollbar{display:none}
.feat .gc{flex:none;width:9.5rem;scroll-snap-align:start}
.tablet .feat .gc{width:10.5rem}

/* category tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 16px 24px}
.tablet .tiles{grid-template-columns:repeat(3,1fr)}
.tile{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--surface);text-align:left;min-height:68px}
.tile .pic{width:48px;height:48px;border-radius:10px;border:1px solid var(--line);flex:none}
.tile b{display:block;font-size:.9375rem;line-height:1.25}
.tile small{color:var(--muted);font-size:.8125rem}

/* category chips + toolbar + pager */
.chips{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);display:flex;gap:8px;overflow-x:auto;padding:8px 16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--edge);background:var(--surface);font-size:.875rem;font-weight:700;white-space:nowrap}
.chip small{font-weight:400;color:var(--muted);margin-left:4px;font-size:.75rem}
.chip[aria-pressed=true]{background:var(--fill);border-color:var(--fill);color:var(--onfill)}
.chip[aria-pressed=true] small{color:var(--onfill);opacity:.85}
.tb{display:flex;align-items:center;justify-content:space-between;padding:10px 16px 8px;color:var(--muted);font-size:.875rem}
.tb b{color:var(--text)}
.vt{display:inline-flex;border:1px solid var(--edge);border-radius:999px;overflow:hidden}
.vt button{width:44px;height:36px;border:0;background:var(--surface);color:var(--muted);display:grid;place-items:center}
.vt button+button{border-left:1px solid var(--edge)}
.vt button[aria-pressed=true]{background:var(--tint);color:var(--acc)}
.pager{display:flex;align-items:center;justify-content:center;gap:6px;padding:16px 16px 28px}
.pager button{min-width:44px;height:44px;padding:0 12px;border-radius:999px;border:1px solid var(--edge);background:var(--surface);font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:2px}
.pager button[aria-current=page]{background:var(--fill);border-color:var(--fill);color:var(--onfill)}
.pager button:disabled{border-color:var(--line);color:var(--muted);cursor:default}

/* picture placeholders (one small picture per product, about 300 px) */
.pic{--h:30;position:relative;background:hsl(var(--h) 38% var(--ph));overflow:hidden;display:block}
.pic svg{display:block;width:100%;height:100%}
.pic .sh{fill:hsl(var(--h) var(--ps) var(--pl))}
.pic .sh2{fill:hsl(var(--h) 30% calc(var(--pl) + 22%));opacity:.9}
:root[data-theme=dark] .pic .sh2{fill:hsl(var(--h) 25% calc(var(--pl) - 18%))}
.pic.so svg{opacity:.5}
.pic .st{fill:none;stroke:hsl(var(--h) var(--ps) var(--pl));stroke-width:5;stroke-linecap:round}
.pic .st2{fill:none;stroke:hsl(var(--h) 30% calc(var(--pl) + 22%));stroke-width:2.2;stroke-linecap:round;opacity:.9}
:root[data-theme=dark] .pic .st2{stroke:hsl(var(--h) 25% calc(var(--pl) - 18%))}
.vopt{margin:12px 0 4px}.vopt .ol{font-size:.8125rem;font-weight:700;margin-bottom:6px}
.chs{display:flex;flex-wrap:wrap;gap:8px}
.chs .chip{min-width:48px;min-height:44px}
.chs .chip:disabled{color:var(--muted);border-color:var(--line);background:var(--s2);cursor:not-allowed}
.chs .chip:disabled small{display:block;font-size:.6875rem;margin:0}
.badge{position:absolute;left:6px;top:6px;font-size:.6875rem;font-weight:700;border-radius:999px;padding:1px 8px;background:var(--warnbg);color:var(--warn);border:1px solid var(--pill-border)}
.badge.so{background:var(--surface);color:var(--muted);border-color:var(--line)}

/* dish rows: full width, hairlines, 64 px picture on the left (DishesView.tsx) */
.lst{margin:0;border-top:1px solid var(--line)}
.tablet .lst.l{display:grid;grid-template-columns:1fr 1fr}
.pr{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.pr .pic{width:64px;height:64px;border-radius:10px;flex:none;border:1px solid var(--line)}
.inf{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.nm{font-weight:700;font-size:1rem;line-height:1.25}
.sz{color:var(--muted);font-size:.875rem}
.pc{font-size:.875rem;font-variant-numeric:tabular-nums}
.pc b{font-weight:700}
.stk{display:inline-flex;font-size:.75rem;font-weight:700;color:var(--warn)}
.stk.so{color:var(--muted)}
.pr.so,.gc.so{color:var(--muted)}
.pr.so .nm,.gc.so .nm{color:var(--muted)}
.ctl{flex:none;display:inline-flex;align-items:center;gap:8px}
.round{width:44px;height:44px;border-radius:50%;border:0;background:var(--line);color:var(--text);display:inline-flex;align-items:center;justify-content:center;padding:0}
.round:disabled{opacity:.4;cursor:not-allowed}
.round svg{width:18px;height:18px}
.qty{min-width:1.5rem;text-align:center;font-weight:700;color:var(--acc);font-variant-numeric:tabular-nums}
.so-pill{display:inline-flex;align-items:center;min-height:36px;padding:0 12px;border:1px solid var(--edge);border-radius:999px;font-size:.875rem;font-weight:700;white-space:nowrap;color:var(--text)}

/* grid cards */
.gr{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:4px 16px 4px}
.tablet .gr{grid-template-columns:repeat(4,1fr);gap:16px}
.gc{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;text-align:left}
.gc .pic{aspect-ratio:1/1;width:100%}
.gc .tx{padding:8px 10px 10px;display:flex;flex-direction:column;flex:1}
.gc .nm{font-size:.875rem;min-height:2.5em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.gc .bt{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:6px;gap:4px}
.empty{text-align:center;padding:40px 16px;color:var(--muted)}
.empty svg{width:40px;height:40px;stroke-width:1.5}
.empty b{display:block;color:var(--text);margin:8px 0 2px;font-size:1rem}

/* basket bar (sticky, above the tab bar) and tab bar */
.bbar{flex:none;padding:12px 16px;background:linear-gradient(transparent,var(--bg) 30%)}
.bbar button,.main{display:flex;width:100%;max-width:728px;margin:0 auto;align-items:center;justify-content:center;gap:8px;min-height:3.25rem;padding:0 16px;border:0;border-radius:999px;background:var(--fill);color:var(--onfill);font-weight:700;font-size:1rem}
.bbar button{justify-content:space-between}
.bbar .n{display:inline-grid;place-items:center;min-width:24px;height:24px;border-radius:999px;background:var(--onfill);color:var(--fill);font-size:.8125rem;margin-right:8px;padding:0 6px}
.main:disabled{opacity:.5;cursor:not-allowed}
.tabbar{display:flex;flex:none;background:var(--bg);border-top:1px solid var(--line)}
.tabin>div{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:56px;font-size:.8125rem;color:var(--muted)}
.tabin>div.on{color:var(--acc);font-weight:700}
.tabin>div.on::before{content:"";position:absolute;top:0;width:2rem;height:3px;border-radius:0 0 3px 3px;background:var(--acc)}
.tabbar svg{width:22px;height:22px}
.tabin{display:flex;width:100%;max-width:760px;margin:0 auto}

/* product sheet: modest square picture, same small file as the list */
.scrim{position:absolute;inset:0;z-index:30;background:rgb(20 18 12/52%);display:flex;align-items:flex-end;justify-content:center}
.tablet .scrim{align-items:center}
.sheet{background:var(--surface);width:100%;max-height:92%;overflow-y:auto;border-radius:18px 18px 0 0;position:relative;padding:16px}
.tablet .sheet{width:560px;border-radius:16px;display:flex;gap:20px;align-items:flex-start;padding:20px}
.sheet .pic{width:168px;height:168px;border-radius:12px;border:1px solid var(--line);flex:none}
.tablet .sheet .pic{width:220px;height:220px}
.sheet .top2{display:flex;gap:14px;align-items:flex-start;padding-right:36px}
.sheet .x{position:absolute;right:6px;top:6px;width:44px;height:44px;border-radius:50%;border:0;background:transparent;color:var(--text);display:grid;place-items:center;z-index:2}
.sheet .sb{flex:1;min-width:0}
.sheet h3{margin:0;font-size:1.25rem;line-height:1.25}
.sheet .pc2{font-size:1.125rem;font-weight:700;margin:6px 0}
.sheet p{margin:8px 0;color:var(--muted);font-size:.9375rem}
.stkn{display:flex;align-items:center;gap:6px;font-size:.875rem;font-weight:700;color:var(--warn);margin:8px 0}
.stkn.so{color:var(--muted)}
.stkn.ok{color:var(--ok)}
.qrow{display:flex;align-items:center;justify-content:space-between;margin:14px 0 12px;font-weight:700}
.qrow .ctl{gap:12px}

/* basket screen (unchanged from the app) */
.bl{display:flex;gap:10px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line)}
.bl .pic{width:44px;height:44px;border-radius:8px;border:1px solid var(--line);flex:none}
.bl .ls{font-weight:700;font-size:.875rem;min-width:4.6rem;text-align:right;font-variant-numeric:tabular-nums}
.note{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border-radius:12px;background:var(--tint);font-size:.875rem;margin:16px 16px 12px}
.note svg{color:var(--acc);margin-top:1px}
.tr{display:flex;justify-content:space-between;padding:3px 16px;font-variant-numeric:tabular-nums}
.tr.b{font-weight:700;font-size:1.0625rem}
.f2{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--edge);border-radius:999px;overflow:hidden;margin:6px 0}
.f2 div{min-height:44px;display:grid;place-items:center;font-weight:700;background:var(--surface);font-size:.9375rem}
.f2 div.on{background:var(--tint);color:var(--acc)}
.f2 div+div{border-left:1px solid var(--edge)}
.fld{margin:10px 16px}
.fld label{display:block;font-size:.8125rem;font-weight:700;margin-bottom:4px}
.fld .in{min-height:44px;border:1px solid var(--edge);border-radius:12px;background:var(--surface);padding:10px 12px;font-size:1rem}
.same{display:inline-block;font-size:.6875rem;font-weight:600;border:1px dashed var(--edge);color:var(--muted);border-radius:999px;padding:1px 10px;margin:4px 16px 0}
.small{font-size:.8125rem}.muted{color:var(--muted)}

/* notes */
.notes{max-width:1024px;margin:0 auto 40px;padding:0 16px}
.notes>div{background:var(--surface);border:1px solid #cfc8b4;border-left:3px solid var(--bobo);border-radius:0 10px 10px 0;padding:14px 18px;font-size:.875rem}
:root[data-theme=dark] .notes>div{border-color:#3A3F36;border-left-color:var(--bobo)}
.notes h3{margin:0 0 6px;font-size:.9375rem}
.notes h3.t2{margin-top:16px}
.notes ul{margin:0;padding-left:20px}
.notes li{margin:3px 0}
.notes table{width:100%;border-collapse:collapse;margin:6px 0;font-size:.8125rem}
.notes th,.notes td{text-align:left;vertical-align:top;padding:6px 8px;border-bottom:1px solid var(--line)}
.notes th{color:var(--muted);font-weight:600}
.notes td:nth-child(2){font-weight:600}
.notes .tw{overflow-x:auto}
@media print{.top,.sub,.notes{display:none}}
</style>
</head>
<body>
<div class="top">
  <div class="seg" role="group" aria-label="Screen" id="scrseg"></div>
  <div class="seg" role="group" aria-label="Device"><button type="button" data-dev="phone" aria-pressed="true">Phone</button><button type="button" data-dev="tablet" aria-pressed="false">Tablet</button></div>
  <div class="seg" role="group" aria-label="Theme"><button type="button" data-th="light" aria-pressed="true">Light</button><button type="button" data-th="dark" aria-pressed="false">Dark</button></div>
  <div class="seg" role="group" aria-label="Language"><button type="button" data-lang="en" aria-pressed="true">EN</button><button type="button" data-lang="id" aria-pressed="false">ID</button></div>
</div>
<div class="sub"><div class="seg" role="group" id="subseg" aria-label="State"></div></div>
<div class="frame-wrap"><div class="frame phone" id="frame"></div></div>
<div class="notes" id="notes"></div>

<script>
const $=s=>document.querySelector(s);
const IC={
 search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
 plus:'<path d="M12 5v14M5 12h14"/>', minus:'<path d="M5 12h14"/>',
 back:'<path d="m15 18-6-6 6-6"/>', next:'<path d="m9 18 6-6-6-6"/>', x:'<path d="M6 6l12 12M18 6 6 18"/>',
 list:'<path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/>',
 grid:'<rect x="4" y="4" width="7" height="7" rx="1"/><rect x="13" y="4" width="7" height="7" rx="1"/><rect x="4" y="13" width="7" height="7" rx="1"/><rect x="13" y="13" width="7" height="7" rx="1"/>',
 store:'<path d="M4 9 5.5 4h13L20 9M4 9h16M4 9v11h16V9M9 20v-6h6v6"/>',
 bag:'<path d="M6 8h12l1 12H5L6 8Z"/><path d="M9 8a3 3 0 0 1 6 0"/>',
 gear:'<circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/>',
 pin:'<path d="M12 21s-6-5.4-6-10a6 6 0 0 1 12 0c0 4.6-6 10-6 10Z"/><circle cx="12" cy="11" r="2"/>',
 clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
 empty:'<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5M8.5 8.5l5 5M13.5 8.5l-5 5"/>'
};
const ic=(n,c)=>`<svg class="i ${c||''}" viewBox="0 0 24 24" aria-hidden="true">${IC[n]}</svg>`;

const CATS=[
 {id:'bat',h:28,s:'shirt',en:'Batik shirts',id_:'Kemeja batik'},
 {id:'keb',h:345,s:'keb',en:'Kebaya & tops',id_:'Kebaya & atasan'},
 {id:'sar',h:205,s:'sar',en:'Sarong & kain',id_:'Sarung & kain'},
 {id:'bag',h:38,s:'bag',en:'Bags',id_:'Tas'},
 {id:'scf',h:150,s:'scf',en:'Scarves & selendang',id_:'Syal & selendang'},
 {id:'acc',h:12,s:'mask',en:'Accessories',id_:'Aksesori'}
];
/* id, cat, name, detail, price (AUD), stock (null = untracked), description EN, description ID */
const P=[
 ['parang','bat','Batik shirt · Parang','S–XL',79,null,'Hand-stamped batik cotton, long sleeve. Classic parang motif. Cool and light for summer.','Katun batik cap tangan, lengan panjang. Motif parang klasik. Ringan dan adem untuk musim panas.'],
 ['kawung','bat','Batik shirt · Kawung','S–XL',85,null],
 ['mega','bat','Kemeja Mega Mendung','S–XL',92,3],
 ['lurik','bat','Lurik shirt','S–XL',55,null],
 ['encim','keb','Kebaya Encim','S–XL',120,null,'Lace-trimmed kebaya encim with embroidered hem. Cotton voile, lightly lined.','Kebaya encim berenda dengan bordir di bagian bawah. Voile katun, dengan lapisan tipis.'],
 ['kutu','keb','Kebaya kutubaru','S–XL',95,null],
 ['brokat','keb','Blouse brokat','S–XL',80,0],
 ['atasan','keb','Atasan tenun','S–XL',85,null],
 ['tenun','sar','Tenun sarong NTT','2 × 1.1 m',65,null],

  <div class="feat">${FEATURED.map(id=>card(prod(id))).join('')}</div>
  <h2 class="sec">${t().shop}</h2>
  <div class="tiles">${CATS.map(c=>{const l=P.filter(p=>p.cat===c.id);return `<button class="tile" data-cat="${c.id}">${art(l[0])}<span><b>${cname(c)}</b><small>${t().nProd(l.length)}</small></span></button>`}).join('')}</div>
 </div></div>`;
}
function catPage(){
 const c=cat(S.cat), l=P.filter(p=>p.cat===c.id), pages=Math.max(1,Math.ceil(l.length/PAGE));
 const pg=Math.min(S.pg,pages), slice=l.slice((pg-1)*PAGE,pg*PAGE);
 const chips=`<div class="chips" role="group">${CATS.map(x=>`<button class="chip" data-cat="${x.id}" aria-pressed="${x.id===c.id}">${cname(x)}<small>${P.filter(p=>p.cat===x.id).length}</small></button>`).join('')}</div>`;
 const pager=pages>1?`<nav class="pager" aria-label="Pages"><button data-pg="${pg-1}" ${pg<=1?'disabled':''} aria-label="${t().prev}">${ic('back')}</button>${Array.from({length:pages},(_,i)=>`<button data-pg="${i+1}" ${i+1===pg?'aria-current="page"':''} aria-label="${t().pageL(i+1)}">${i+1}</button>`).join('')}<button data-pg="${pg+1}" ${pg>=pages?'disabled':''} aria-label="${t().next}">${t().next}${ic('next')}</button></nav>`:'<div style="height:24px"></div>';
 return topbar(t().backS)+`<div class="scroll"><div class="wrap"><h1 class="title">${cname(c)}</h1>${chips}${toolbar(`<b>${t().nProd(l.length)}</b>`)}${items(slice)}${pager}</div></div>`;
}
function searchPage(){
 const q=S.q.trim().toLowerCase();
 const r=q?P.filter(p=>p.name.toLowerCase().includes(q)):[];
 let body;
 if(!q)body=`<div class="empty">${ic('search')}<b>${t().hint}</b></div>`;
 else if(!r.length)body=`<div class="empty">${ic('empty')}<b>${t().none(S.q.trim())}</b>${t().noneH}</div>`;
 else body=toolbar(`<b>${t().res(r.length)}</b>`)+items(r);
 return topbar(t().backS)+`<div class="scroll"><div class="wrap"><h1 class="title">${t().sTitle}</h1>${searchBox('q')}${body}<div style="height:24px"></div></div></div>`;
}
function sheet(){
 const p=prod(S.sheet); if(!p)return '';
 const so=p.stock===0;
 const sn=so?`<div class="stkn so">${t().soldN}</div>`:(p.stock!=null&&p.stock<=5?`<div class="stkn">${t().leftN(p.stock)}${p.stock===1?' · '+t().handmade:''}</div>`:`<div class="stkn ok">${t().inStock}</div>`);
 const max=p.stock!=null?p.stock:99;
 let vopt='';
 if(SIZED.includes(p.cat)){
  const sold=SZSOLD[p.id]||[];
  vopt=`<div class="vopt"><div class="ol">${t().sizeL}</div><div class="chs" role="group">${SZ.map(z=>`<button class="chip" data-sz="${z}" ${sold.includes(z)?'disabled':''} aria-pressed="${S.sz===z&&!sold.includes(z)}" ${sold.includes(z)?`aria-label="${z} ${t().soldSz}"`:''}>${z}${sold.includes(z)?`<small>${t().soldSz}</small>`:''}</button>`).join('')}</div></div>`;
 }
 if(OPTS[p.id]){
  const o=OPTS[p.id], li=S.lang==='en'?0:1;
  vopt=`<div class="vopt"><div class="ol">${S.lang==='en'?o.en:o.id}</div><div class="chs" role="group">${o.v.map((v,i)=>`<button class="chip" data-op="${i}" aria-pressed="${S.op===i}">${v[li]}</button>`).join('')}</div></div>`;
 }
 const info=`<h3>${p.name}</h3><div class="sz">${p.size}</div><div class="pc2">${rp(p.price)}</div>${sn}`;
 const rest=`<p>${pdesc(p)}</p>${vopt}
   <div class="qrow"><span>${t().qty}</span><span class="ctl" style="gap:12px"><button class="round" data-sdec ${so||S.sq<=1?'disabled':''} aria-label="−">${ic('minus')}</button><output class="qty" style="font-size:1.125rem">${so?0:S.sq}</output><button class="round" data-sinc ${so||S.sq>=max?'disabled':''} aria-label="+">${ic('plus')}</button></span></div>
   <button class="main" data-sadd ${so?'disabled':''}>${so?t().soldB:t().addT(rp(p.price*S.sq))}</button>`;
 return `<div class="scrim" data-scrim><div class="sheet" role="dialog" aria-label="${p.name}">
  <button class="x" data-closeS aria-label="${t().closeS}">${ic('x')}</button>
  ${S.dev==='tablet'?`${art(p)}<div class="sb">${info}${rest}</div>`:`<div class="sb"><div class="top2">${art(p)}<div>${info}</div></div>${rest}</div>`}
  </div></div>`;
}
function basketPage(){
 const lines=Object.entries(S.basket).filter(([,q])=>q>0).map(([id,q])=>{const p=prod(id);return `<div class="bl">${art(p)}<div class="inf"><span class="nm">${p.name}</span><span class="pc">${p.size} · <b>${rp(p.price)}</b></span></div><div class="ctl"><button class="round" data-dec="${id}" aria-label="−">${ic('minus')}</button><output class="qty">${q}</output><button class="round" data-add="${id}" aria-label="+" ${atMax(p)?'disabled':''}>${ic('plus')}</button></div><div class="ls">${rp(p.price*q)}</div></div>`}).join('');
 return topbar(t().backS)+`<div class="scroll"><div class="wrap" style="max-width:640px"><h1 class="title">${t().bT}</h1>
  <span class="same">${t().same}</span>
  <div style="border-top:1px solid var(--line);margin-top:10px">${lines}</div>
  <div class="note">${ic('clock')}<div><b>${t().ready}</b><br><span class="muted">${t().readyH}</span></div></div>
  <div class="fld"><label>${t().how}</label><div class="f2"><div class="on">${t().pick}</div><div>${t().del}</div></div><div class="small muted">${t().pick}: ${t().pickV}<br>${t().del}: ${t().delV}</div></div>
  <div class="fld"><label>${t().yourN}</label><div class="in">${t().nameV}</div></div>
  <div class="tr b" style="margin-top:12px"><span>${t().tot}</span><span>${rp(basketTotal())}</span></div>
  <div class="small muted" style="margin:6px 16px 14px">${t().payN}</div>
  <div style="padding:0 16px 24px"><button class="main">${t().place}</button></div></div></div>`;
}

function render(keepScroll){
 const fr=$('#frame'); const old=fr.querySelector('.scroll'); const st=old?old.scrollTop:0;
 fr.className='frame '+S.dev;
 let inner;
 if(S.page==='basket')inner=basketPage()+tabbar();
 else inner=({home:homePage,cat:catPage,search:searchPage})[S.page]()+bar()+tabbar()+sheet();
 fr.innerHTML=inner;
 const sc=fr.querySelector('.scroll');
 if(sc&&keepScroll)sc.scrollTop=st;
 $('#scrseg').innerHTML=t().scr.map((x,i)=>`<button type="button" data-scr="${i}" aria-pressed="${i===S.scr}">${x}</button>`).join('');
 $('#subseg').innerHTML=t().subs[S.scr].map((x,i)=>`<button type="button" data-sub="${i}" aria-pressed="${i===S.sub[S.scr]}">${x}</button>`).join('');
 document.querySelectorAll('[data-dev]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.dev===S.dev));
 document.querySelectorAll('[data-th]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.th===S.th));
 document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===S.lang));
 document.documentElement.dataset.theme=S.th; document.documentElement.lang=S.lang;
 notes();
}
function notes(){
 const N=t();
 $('#notes').innerHTML=`<div><h3>${N.nH}</h3><ul>${N.n.map(x=>`<li>${x}</li>`).join('')}</ul>
 <h3 class="t2">${N.eH}</h3><div class="tw"><table><thead><tr><th>Item</th><th>Estimate</th><th>Why</th></tr></thead><tbody>${EST.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join('')}</tbody></table></div>
 <p class="muted" style="margin:6px 0 0">${N.q}</p></div>`;
}
function applyScreen(){
 const s=S.scr, u=S.sub[s];
 S.sheet=null; S.q=''; S.pg=1; S.sz='M'; S.op=0;
 if(s===0){S.page='home';}
 if(s===1){S.page='cat';S.cat=u===0?'bat':'bag';S.pg=u===2?2:1;}
 if(s===2){S.page='search';S.q=u===0?'batik':'jeans';}
 if(s===3){S.page='cat';S.cat=['bat','bag','sar','bag'][u];S.sheet=['parang','rattan','songket','clutch'][u];S.sq=1;}
 if(s===4){S.page=u===1?'basket':'home';}
}
document.addEventListener('click',e=>{
 const g=sel=>e.target.closest(sel);
 let b;
 if(b=g('[data-scr]')){S.scr=+b.dataset.scr;applyScreen();render();return}
 if(b=g('[data-sub]')){S.sub[S.scr]=+b.dataset.sub;applyScreen();render();return}
 if(b=g('[data-dev]')){S.dev=b.dataset.dev;S.view=S.dev==='tablet'?'grid':'list';render();return}
 if(b=g('[data-th]')){S.th=b.dataset.th;render(true);return}
 if(b=g('[data-lang]')){S.lang=b.dataset.lang;render(true);return}
 if(b=g('[data-view]')){S.view=b.dataset.view;render(true);return}
 if(b=g('[data-cat]')){S.cat=b.dataset.cat;S.pg=1;S.page='cat';S.q='';render();return}
 if(b=g('[data-pg]')){S.pg=+b.dataset.pg;render();return}
 if(g('[data-home]')){S.page='home';S.q='';render();return}
 if(g('[data-clr]')){S.q='';render(true);return}
 if(b=g('[data-add]')){e.stopPropagation();const id=b.dataset.add,p=prod(id);if(!atMax(p))S.basket[id]=bq(id)+1;render(true);return}
 if(b=g('[data-dec]')){const id=b.dataset.dec;S.basket[id]=Math.max(0,bq(id)-1);if(!S.basket[id])delete S.basket[id];render(true);return}
 if(g('[data-basket]')){S.page='basket';S.scr=4;S.sub[4]=1;render();return}
 if(g('[data-sdec]')){S.sq=Math.max(1,S.sq-1);render(true);return}
if(b=g('[data-sz]')){S.sz=b.dataset.sz;render(true);return}
if(b=g('[data-op]')){S.op=+b.dataset.op;render(true);return}
 if(g('[data-sinc]')){const p=prod(S.sheet);S.sq=Math.min(p.stock!=null?p.stock:99,S.sq+1);render(true);return}
 if(g('[data-sadd]')){const id=S.sheet;S.basket[id]=bq(id)+S.sq;S.sheet=null;render(true);return}
 if(g('[data-closeS]')||(e.target.hasAttribute&&e.target.hasAttribute('data-scrim'))){S.sheet=null;render(true);return}
 if(b=g('[data-open]')){S.sheet=b.dataset.open;S.sq=1;render(true);return}
});
document.addEventListener('input',e=>{
 if(e.target.id!=='q')return;
 const pos=e.target.selectionStart; S.q=e.target.value;
 if(S.page==='home'){S.page='search';render()}else render(true);
 const i=$('#q'); if(i){i.focus();i.setSelectionRange(pos,pos)}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.sheet){S.sheet=null;render(true)}});
applyScreen();render();
</script>
</body>
</html>
