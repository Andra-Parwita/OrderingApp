<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Plan 115: public/splash.js sets the saved light/dark choice before the first paint and removes the splash (no inline scripts: the CSP forbids them). -->
    <script src="/splash.js" data-cfasync="false"></script>
    <!--
      Plan 115: the page colour and the loading splash, drawn before the app file arrives.
      --bg is each kitchen theme's page background: a COPY of src/theme/designTokens.ts
      (brands.<theme>.<mode>.bg); src/theme/indexHtmlColours.test.ts fails if they drift apart.
      Hotfix 1.0.43.3: the splash itself is the dark spotlight in light and dark mode and for every
      kitchen, the same as the iOS launch picture (scripts/startup-images/kitchen.json); the test
      pins its colours to that file. It does not use --bg.
    -->
    <style>
      :root {
        --bg: #f6f2e8;
      }
      html[data-brand='bali'] {
        --bg: #f1f4f4;
      }
      html[data-brand='sumatra'] {
        --bg: #f7f0ee;
      }
      html[data-brand='sunda'] {
        --bg: #f2f2f7;
      }
      html[data-brand='jawa'] {
        --bg: #f6f0e6;
      }
      @media (prefers-color-scheme: dark) {
        html:not([data-theme='light']) {
          --bg: #121411;
        }
        html:not([data-theme='light'])[data-brand='bali'] {
          --bg: #101417;
        }
        html:not([data-theme='light'])[data-brand='sumatra'] {
          --bg: #161112;
        }
        html:not([data-theme='light'])[data-brand='sunda'] {
          --bg: #111219;
        }
        html:not([data-theme='light'])[data-brand='jawa'] {
          --bg: #15120e;
        }
      }
      html[data-theme='dark'] {
        --bg: #121411;
      }
      html[data-theme='dark'][data-brand='bali'] {
        --bg: #101417;
      }
      html[data-theme='dark'][data-brand='sumatra'] {
        --bg: #161112;
      }
      html[data-theme='dark'][data-brand='sunda'] {
        --bg: #111219;
      }
      html[data-theme='dark'][data-brand='jawa'] {
        --bg: #15120e;
      }
      html {
        background: var(--bg);
      }
      #splash {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.85rem;
        /* Icon and name sit as one group at 44% of the height (centre of the box is 50%). */
        padding-bottom: 12vh;
        pointer-events: none;
        color: #f1eee6;
        --logo-bg: #ead9b6;
        --logo-ink: #5b4426;
        /* Dark spotlight, the same as the iOS launch picture: edge #2a2b26, centre #4a4b43 at 44%,
           smoothstep fade to 68% of the width, then the corner and bottom darkening. */
        background:
          linear-gradient(180deg, transparent 50%, rgba(0, 0, 0, 0.08) 100%),
          radial-gradient(
            ellipse farthest-corner at 50% 50%,
            transparent 0%,
            rgba(0, 0, 0, 0.04) 50%,
            rgba(0, 0, 0, 0.16) 100%
          ),
          radial-gradient(
            circle 68vw at 50% 44%,
            #4a4b43 0%,
            #494a42 12.5%,
            #45463e 25%,
            #40413a 37.5%,
            #3a3b35 50%,
            #34352f 62.5%,
            #2f302b 75%,
            #2b2c27 87.5%,
            #2a2b26 100%
          ),
          #2a2b26;
        font-family:
          'Plus Jakarta Sans',
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
      }
      /* Safety net without JS: a rendered app is never covered. */
      #root:not(:empty) ~ #splash {
        animation: sp-out 200ms ease-in forwards;
      }
      /* Colour, icon and name show at once (plan 115): the saved page is served instantly, so no delay. */
      #splash {
        animation: sp-in 220ms ease-out forwards;
        opacity: 0;
      }
      #splash.sp-out {
        animation: sp-out 200ms ease-in forwards;
      }
      .sp-logo {
        display: grid;
        place-items: center;
        width: 72px;
        height: 72px;
      }
      .sp-logo img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 1.1rem;
        box-shadow: 0 0.6rem 1.6rem rgba(0, 0, 0, 0.45);
        opacity: 0;
        transition: opacity 220ms ease-out;
      }
      .sp-logo img.sp-on {
        opacity: 1;
      }
      .sp-bobo img {
        object-fit: contain;
        border-radius: 0;
        box-shadow: none;
      }
      .sp-ini {
        border-radius: 1.1rem;
        background: var(--logo-bg);
        color: var(--logo-ink);
        box-shadow: 0 0.6rem 1.6rem rgba(0, 0, 0, 0.45);
        font-weight: 700;
        font-size: 1.35rem;
        letter-spacing: 0.02em;
      }
      #splash-name {
        font-size: 1.2rem;
        font-weight: 600;
        letter-spacing: 0.01em;
      }
      @keyframes sp-in {
        to {
          opacity: 1;
        }
      }
      @keyframes sp-out {
        to {
          opacity: 0;
          visibility: hidden;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #root:not(:empty) ~ #splash {
          display: none;
        }
        #splash {
          animation: none;
          opacity: 1;
        }
        .sp-logo img {
          transition: none;
        }
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
    />
    <!-- Plan 119 / hotfix 1.0.43.3: iOS launch pictures for the kitchen apps (dark spotlight), made by
         scripts/make-startup-images.mjs from scripts/startup-images/kitchen.json. Guide: docs/guide/launch-pictures.md -->
    <!-- Some iOS versions only use launch pictures with this; every page is a standalone home-screen app via its manifest anyway. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link
      rel="apple-touch-startup-image"
      href="/startup/kitchen/startup-390x844.png"
      media="screen and (device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
    />
    <link
      rel="apple-touch-startup-image"
      href="/startup/kitchen/startup-393x852.png"
      media="screen and (device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
    />
    <link
      rel="apple-touch-startup-image"
      href="/startup/kitchen/startup-402x874.png"
      media="screen and (device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
    />
    <link
      rel="apple-touch-startup-image"
      href="/startup/kitchen/startup-420x912.png"
      media="screen and (device-width: 420px) and (device-height: 912px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
    />
    <link
      rel="apple-touch-startup-image"
      href="/startup/kitchen/startup-428x926.png"
      media="screen and (device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
    />
    <link
      rel="apple-touch-startup-image"
      href="/startup/kitchen/startup-430x932.png"
      media="screen and (device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
    />
    <link
      rel="apple-touch-startup-image"
      href="/startup/kitchen/startup-440x956.png"
      media="screen and (device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
    />
    <meta name="robots" content="noindex, nofollow" />
    <title>ShaggyBobo</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Plan 115: the Worker swaps in the kitchen's name and logo (worker/pages.ts); sellers get ShaggyBobo. -->
    <div id="splash" aria-hidden="true">
      <span id="splash-logo" class="sp-logo sp-bobo"
        ><img id="splash-img" src="/brand/logo-icon.webp" alt="" width="72" height="72"
      /></span>
      <span id="splash-name">ShaggyBobo</span>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
