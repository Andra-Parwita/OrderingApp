<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Plan 115: public/splash.js sets the saved light/dark choice before the first paint and removes the splash (no inline scripts: the CSP forbids them). -->
    <script src="/splash.js" data-cfasync="false"></script>
    <!--
      Plan 115: the page colour and the loading splash, drawn before the app file arrives.
      --bg is each kitchen theme's page background and --ink the text colour: COPIES of
      src/theme/designTokens.ts (brands.<theme>.<mode>.bg, neutral.<mode>.text);
      src/theme/indexHtmlColours.test.ts fails if they drift apart.
    -->
    <style>
      :root {
        --bg: #f6f2e8;
        --ink: #1c1f1a;
        --glow: rgba(255, 255, 255, 0.6);
        --weave: rgba(120, 96, 58, 0.055);
        --shade: rgba(120, 96, 58, 0.1);
        --logo-bg: #ead9b6;
        --logo-ink: #5b4426;
        --logo-shadow: rgba(60, 40, 10, 0.14);
      }
      html[data-brand='bali'] {
        --bg: #f1f4f4;
      }
      html[data-brand='sumatra'] {
        --bg: #f7f0ee;
      }
      html[data-brand='sunda'] {
        --bg: #f2f2f7;
      }
      html[data-brand='jawa'] {
        --bg: #f6f0e6;
      }
      @media (prefers-color-scheme: dark) {
        html:not([data-theme='light']) {
          --bg: #121411;
          --ink: #f1eee6;
          --glow: rgba(255, 255, 255, 0.07);
          --weave: rgba(235, 220, 190, 0.035);
          --shade: rgba(0, 0, 0, 0.35);
          --logo-shadow: rgba(0, 0, 0, 0.45);
        }
        html:not([data-theme='light'])[data-brand='bali'] {
          --bg: #101417;
        }
        html:not([data-theme='light'])[data-brand='sumatra'] {
          --bg: #161112;
        }
        html:not([data-theme='light'])[data-brand='sunda'] {
          --bg: #111219;
        }
        html:not([data-theme='light'])[data-brand='jawa'] {
          --bg: #15120e;
        }
      }
      html[data-theme='dark'] {
        --bg: #121411;
        --ink: #f1eee6;
        --glow: rgba(255, 255, 255, 0.07);
        --weave: rgba(235, 220, 190, 0.035);
        --shade: rgba(0, 0, 0, 0.35);
        --logo-shadow: rgba(0, 0, 0, 0.45);
      }
      html[data-theme='dark'][data-brand='bali'] {
        --bg: #101417;
      }
      html[data-theme='dark'][data-brand='sumatra'] {
        --bg: #161112;
      }
      html[data-theme='dark'][data-brand='sunda'] {
        --bg: #111219;
      }
      html[data-theme='dark'][data-brand='jawa'] {
        --bg: #15120e;
      }
      html {
        background: var(--bg);
      }
      #splash {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.85rem;
        pointer-events: none;
        color: var(--ink);
        font-family:
          'Plus Jakarta Sans',
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
      }
      /* Woven texture, lamp light and a soft fall-off, over the page colour. */
      #splash::before {
        content: '';
        position: absolute;
        inset: 0;
        background:
          radial-gradient(70% 45% at 50% 44%, var(--glow) 0%, transparent 70%),
          repeating-linear-gradient(45deg, var(--weave) 0 2px, transparent 2px 9px),
          repeating-linear-gradient(-45deg, var(--weave) 0 2px, transparent 2px 9px),
          linear-gradient(180deg, transparent 0%, var(--shade) 100%);
      }
      /* The light breathes once. */
      #splash::after {
        content: '';
        position: absolute;
        inset: 0;
        background: radial-gradient(45% 28% at 50% 44%, var(--glow), transparent 70%);
      }
      /* Safety net without JS: a rendered app is never covered. */
      #root:not(:empty) ~ #splash {
        animation: sp-out 200ms ease-in forwards;
      }
      #splash > * {
        position: relative;
      }
      /* Colour at once; everything else after 250 ms, so a fast launch never flickers. */
      #splash::before,
      #splash > * {
        opacity: 0;
        animation: sp-in 220ms ease-out 250ms forwards;
      }
      #splash::after {
        opacity: 0;
        animation: sp-breathe 2.4s ease-in-out 450ms 1;
      }
      #splash.sp-out {
        animation: sp-out 200ms ease-in forwards;
      }
      .sp-logo {
        display: grid;
        place-items: center;
        width: 4.5rem;
        height: 4.5rem;
      }
      .sp-logo img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 1.1rem;
        box-shadow: 0 0.6rem 1.6rem var(--logo-shadow);
        opacity: 0;
        transition: opacity 220ms ease-out;
      }
      .sp-logo img.sp-on {
        opacity: 1;
      }
      .sp-bobo img {
        object-fit: contain;
        border-radius: 0;
        box-shadow: none;
      }
      .sp-ini {
        border-radius: 1.1rem;
        background: var(--logo-bg);
        color: var(--logo-ink);
        box-shadow: 0 0.6rem 1.6rem var(--logo-shadow);
        font-weight: 700;
        font-size: 1.35rem;
        letter-spacing: 0.02em;
      }
      #splash-name {
        font-size: 1.2rem;
        font-weight: 600;
        letter-spacing: 0.01em;
      }
      @keyframes sp-in {
        to {
          opacity: 1;
        }
      }
      @keyframes sp-out {
        to {
          opacity: 0;
          visibility: hidden;
        }
      }
      @keyframes sp-breathe {
        0%,
        100% {
          opacity: 0;
        }
        50% {
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #root:not(:empty) ~ #splash {
          display: none;
        }
        #splash::before,
        #splash > * {
          animation: none;
          opacity: 1;
        }
        #splash::after {
          animation: none;
        }
        .sp-logo img {
          transition: none;
        }
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
    />
    <meta name="robots" content="noindex, nofollow" />
    <title>ShaggyBobo</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Plan 115: the Worker swaps in the kitchen's name and logo (worker/pages.ts); sellers get ShaggyBobo. -->
    <div id="splash" aria-hidden="true">
      <span id="splash-logo" class="sp-logo sp-bobo"
        ><img id="splash-img" src="/brand/logo-icon.webp" alt="" width="72" height="72"
      /></span>
      <span id="splash-name">ShaggyBobo</span>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
